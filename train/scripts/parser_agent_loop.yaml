- name: parser_lead_agent
  _target_: scripts.parser_agent_loop.ParserLeadAgentLoop
  max_iterations: 9
  max_new_token_each_turn: 2048
  subagent_config:
    api_key: ""
    base_url: http://localhost/v1
    unix_socket_path: ${oc.env:LONGMAS_NGINX_SOCKET,/tmp/longmas_sglang_nginx.sock}
    connector_limit: 128
    max_concurrency: 64
    model: Qwen3.5-4B
    temperature: 0.7
    max_tokens: 512
    max_retries: 6
